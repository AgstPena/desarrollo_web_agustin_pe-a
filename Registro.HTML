<!DOCTYPE html> 
<html lang="es">
    <head>
        <title>Registrate</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <header>
        <h1>Crea una cuenta nueva</h1>
    </header>
    <body class="registro_body">

        <ul class="NavBar">
            <li><a href="Inicio.html"> Inicio</a></li>
            <li><a href="VistaAves.html"> Registra tu avistamiento</a></li>
        </ul><br>
        <div class="registro-containers">
        <form id="new_account" class="main-container">    
            <h2>Registrate</h2>
            <div class="input-control">
            <label for="full_name">Nombre: </label>
            <input type="full_name" id="full_name" name="full_name"><br>
            </div>

            <div class="input-control">
            <label for="psw">Contraseña</label>
            <input type="password" id="psw"><br>
            </div>

            <div class="input-control">
            <label for="email">Correo: </label>
            <input type="email" id="email" name="email"><br>
            </div>

            <div class="input-control">
            <label for="region">Región: </label>
            <input type="text" id="region" name="region" list="Regiones" placeholder="Región..."><br>
            <datalist id="Regiones">
                <option value="Región de Arica - Parinacota (XV)">
                <option value="Región de Tarapaca (I)">
                <option value="Región de Antofagasta (II)">
                <option value="Región de Atacama (III)">
                <option value="Región de Coquimbo (IV)">
                <option value="Región de Valparaiso (V)">
                <option value="Región Metropolitana (RM)">
                <option value="Región de Libertador General Bernardo O'Higgins (VI)">
                <option value="Región del Maule (VII)">
                <option value="Region de Ñuble (XVI)">
                <option value="Región de Biobio (VIII)">
                <option value="Región de La Araucania (IX)">
                <option value="Región de Los Rios (XIV)">
                <option value="Región de Los Lagos (X)">
                <option value="Región de Aisen del General Carlos Ibañes del Campo (XI)">
                <option value="Región de Magallanes y Antartica Chilena (XII)">
            </datalist>
            </div>

            <div class="input-control">
            <label for="comuna">Comuna: </label>
            <input type="text" id="comuna" name="comuna"><br>
            </div>

            <div class="input-control">
            <label for="telefono">Telefono:</label>
            <input type="phone" id="telefono" placeholder="+000 0000 0000">
            </div>

            <button id="submit_btn" type="button">Crear cuenta</button>
        </form>

        <form id="access_account", class="main-container">
            <h2>Ingresa</h2>

            <div class="input-control">
            <label for="email">Correo: </label>
            <input type="email" id="email" name="email" required><br>
            </div>

            <div class="input-control">
            <label for="psw">Contraseña</label>
            <input type="password" id="psw" required><br>
            </div>

            <button id="access_btn" type="button">Inicia sesion</button>
        </form>

        <script src = "RegistroAves.JS"></script>
    </body>

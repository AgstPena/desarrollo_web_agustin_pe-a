<!DOCTYPE html> 
<html lang="es">
    <head>
        <title>Registrate</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    </head>
    <body class="registro_body">

    <header>
        <h1>Crea una cuenta nueva</h1>
    </header>

        <ul class="NavBar">
            <li><a href="{{ url_for('index') }}"> Inicio</a></li>
            <li><a href="{{ url_for('lista_data') }}"> Avistamientos</a></li>
            <li><a href="{{ url_for('vista_aves') }}"> Registra tu avistamiento</a></li>
            
        </ul><br>
        <div class="registro-containers">
        <form id="new_account" class="main-container" method="post" action="{{ url_for('register') }}">
            {% if error %}<p class="error-msg">{{ error }}</p>{% endif %}    
            <h2>Registrate</h2>
            <div class="input-control">
            <label for="full_name">Nombre* </label>
            <input type="text" id="full_name" name="full_name"><br>
            </div>

            <div class="input-control">
            <label for="email">Correo* </label>
            <input type="email" id="email" name="email"><br>
            </div>

            <div class="input-control">
            <label for="region">Región* </label>
            <select id="region" name="region">
                <option value="">Selecciona una región</option>
                {% for r in regiones %}
                <option value="{{ r.id }}">{{ r.nombre }}</option>
                {% endfor %}
            </select>
            </div>

            <div class="input-control">
            <label for="comuna">Comuna* </label>
            <select id="comuna" name="comuna_id">
                <option value="">Selecciona primero una región</option>
            </select>
            </div>

            <div class="input-control">
            <label for="telefono">Telefono*</label>
            <input type="tel" id="telefono" name="telefono" placeholder="+569 1234 5678">
            </div>
            

            <button id="submit_btn" type="button">Crear cuenta</button>
        </form>


        </div>

        <script src="{{ url_for('static', filename='js/RegistroAves.js') }}"></script>
    </body>
